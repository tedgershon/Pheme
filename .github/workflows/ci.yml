name: CI

on:
  pull_request:
    branches: [main, 'backend/**']
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      schemathesis:
        description: Run the optional backend schema checks
        type: boolean
        default: false

env:
  SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io

jobs:
  database:
    name: Database (bootstrap and legacy upgrade)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Test migrations in disposable Supabase
        run: python scripts/db/test_migrations.py
      - name: Stop disposable Supabase
        if: always()
        run: npx --no-install supabase stop --workdir .migration-test --no-backup

  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest --junitxml=pytest-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-pytest-report
          path: backend/pytest-report.xml
          if-no-files-found: ignore

  schemathesis:
    name: Schemathesis (soft gate)
    needs: backend
    if: ${{ vars.SCHEMATHESIS == '1' || inputs.schemathesis }}
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      SCHEMATHESIS: '1'
      SENTRY_ENVIRONMENT: test
      SENTRY_DSN: ''
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check the OpenAPI contract and anonymous access
        run: pytest tests/test_schemathesis.py -v --junitxml=schemathesis-report.xml

      - name: Report soft-gate failures
        if: failure()
        run: echo '::warning::Schemathesis soft gate failed. See the job log and test report.'

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-schemathesis-report
          path: backend/schemathesis-report.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  e2e:
    name: Browser (Playwright)
    runs-on: ubuntu-latest
    env:
      # Servers are started explicitly below; Playwright does not start its own.
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      E2E_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Supabase CLI
        run: npm ci

      - name: Start disposable Supabase
        run: npx --no-install supabase start --exclude studio,postgres-meta,edge-runtime,logflare,vector,realtime,imgproxy

      - name: Point both applications at the disposable stack
        run: python scripts/configure_local_env.py

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: pnpm exec playwright install-deps chromium

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      - name: Start backend
        working-directory: backend
        run: nohup python -m uvicorn main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/backend.log" 2>&1 &

      - name: Start frontend
        working-directory: frontend
        run: nohup pnpm start --hostname localhost --port 3000 > "$RUNNER_TEMP/frontend.log" 2>&1 &

      - name: Wait for servers
        run: |
          for url in http://127.0.0.1:8000/ http://localhost:3000/; do
            timeout 120 bash -c "until curl -fsS -o /dev/null $url; do sleep 2; done"
          done

      - name: Browser tests
        working-directory: frontend
        run: pnpm e2e

      - name: Collect server logs
        if: failure()
        run: |
          mkdir -p frontend/playwright-report
          cp "$RUNNER_TEMP"/backend.log "$RUNNER_TEMP"/frontend.log frontend/playwright-report/ || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore

      - name: Stop disposable Supabase
        if: always()
        run: npx --no-install supabase stop --no-backup
